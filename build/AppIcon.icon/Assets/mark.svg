  <path d="M 55.2 72.4 A 13 25 0 0 1 38.6 39.2" transform="rotate(108 50 50)" stroke="#D4F6FF" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 55.2 72.4 A 13 25 0 0 1 38.6 39.2" transform="rotate(228 50 50)" stroke="#D4F6FF" stroke-width="3.5" stroke-linecap="round" />

  <!-- Over-pass: main orbital arms with dark halo for crisp weave -->
  <g transform="rotate(-12 50 50)">
    <path d="M 50 25 A 13 25 0 0 1 58.6 68.5" stroke="#272A36" stroke-width="7.4" stroke-linecap="round" />
    <path d="M 50 25 A 13 25 0 0 1 58.6 68.5" stroke="#D4F6FF" stroke-width="3.5" stroke-linecap="round" />
  </g>
  <g transform="rotate(108 50 50)">
