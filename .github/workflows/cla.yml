# CLA Assistant Lite: asks first-time contributors to sign CLA.md in the PR.
# Signatures are stored in this repo on the `cla-signatures` branch (created automatically).
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          github.event_name == 'pull_request_target' ||
          (github.event.issue.pull_request != null && (
            contains(github.event.comment.body, 'recheck') ||
            contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')
          ))
        # v2.6.1, pinned to the commit
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          allowlist: xiaozhenyangCode,dependabot[bot],github-actions[bot]
